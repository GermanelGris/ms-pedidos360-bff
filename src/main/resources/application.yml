server:
  port: 8080

spring:
  application:
    name: ms-pedidos360-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          # IDaaS (Microsoft Entra ID). Desde aquí se obtienen las llaves públicas (JWKS) para validar la FIRMA.
          issuer-uri: https://login.microsoftonline.com/${TENANT_ID:00000000-0000-0000-0000-000000000000}/v2.0
          # Audiencias aceptadas: el token debe haber sido emitido para esta API.
          audiences: ${API_CLIENT_ID:00000000-0000-0000-0000-000000000000},api://${API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

pedidos360:
  security:
    # Scope delegado expuesto en "Exponer una API" de la app Pedidos360-API
    required-scope: ${API_SCOPE:Pedidos.ReadWrite}

services:
  orders-url: ${ORDERS_URL:http://localhost:8081}
  catalog-url: ${CATALOG_URL:http://localhost:8082}
  report-url: ${REPORT_URL:http://localhost:8084}
  audit-url: ${AUDIT_URL:http://localhost:8085}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
